name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Replace outdated PR checks, but let every main push finish and release.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify installable package
        run: npm run test:package
        env:
          PACKAGE_DIRECTORY: release
      - name: Validate npm publication without publishing
        run: npm publish ./release/deskercise-*.tgz --dry-run --access public --provenance=false

  release:
    name: Release
    needs: [tests, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 15
    # Queue every release; npm's latest tag must not race between main pushes.
    concurrency:
      group: deskercise-releases
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_RUN_NUMBER: ${{ github.run_number }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.21.0
      - name: Install dependencies
        run: npm ci
      - name: Assign release version
        run: |
          version=$(node scripts/release-version.mjs)
          npm version "$version" --no-git-tag-version
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Package and verify installation
        run: |
          npm shrinkwrap
          npm run test:package
        env:
          PACKAGE_DIRECTORY: release
      - name: Generate checksum
        working-directory: release
        run: shasum -a 256 "deskercise-$RELEASE_VERSION.tgz" > SHA256SUMS
      - name: Publish GitHub release
        run: bash scripts/publish-release.sh
      - name: Publish the verified package to npm
        run: node scripts/publish-npm.mjs
